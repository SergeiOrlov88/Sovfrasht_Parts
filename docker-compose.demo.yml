# Показательная версия для заказчика: полный стек на одном сервере.
#
# Отличия от docker-compose.yml (локальная разработка):
#   * наружу (0.0.0.0) опубликованы ТОЛЬКО фронтенд и API;
#     postgres, redis и minio доступны лишь внутри сети compose;
#   * фронтенд собран и раздаётся nginx-контейнером, а не dev-сервером Vite;
#   * код копируется в образ, а не монтируется с хоста.
#
# Запуск:  docker compose -f docker-compose.demo.yml up -d --build

name: sovfrasht-demo

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Портов наружу нет: обращение только по имени сервиса внутри сети
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    # Наружу не публикуем. Фото отдаются через nginx фронтенда по подписанным
    # ссылкам — см. location /scans/ в frontend/nginx.conf
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: >
      sh -c "alembic -c /srv/backend/alembic.ini upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"
    env_file: .env
    ports:
      - "${API_PUBLIC_PORT:-8091}:8000"
    volumes:
      # Стартовые данные — это данные, а не код: монтируем только на чтение,
      # чтобы обновлять каталог без пересборки образа
      - ./seed:/srv/seed:ro
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A worker.celery_app worker --loglevel=info --concurrency=2
    env_file: .env
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
      api: {condition: service_started}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Абсолютный адрес API вшивается в бандл на сборке: фронтенд
        # раздаётся отдельно от бэкенда, относительные пути не сработают
        VITE_API_BASE: ${VITE_API_BASE}
    ports:
      - "${FRONT_PUBLIC_PORT:-8090}:80"
    depends_on:
      api: {condition: service_started}
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
