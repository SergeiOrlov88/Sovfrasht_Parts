server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: любой неизвестный путь отдаём index.html, маршрутизация на клиенте
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Фото сканов лежат в MinIO, который наружу НЕ публикуется. Проксируем их
    # сюда: подписанная ссылка формируется на этот же адрес, поэтому Host в
    # запросе совпадает с тем, по которому считалась подпись, и MinIO её примет.
    location /scans/ {
        proxy_pass http://minio:9000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
    }

    # Статика бандла неизменяемая (в имени файла хеш) — можно кэшировать надолго
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
